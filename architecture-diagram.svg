<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="550" fill="#0f172a" rx="10"/>
  <text x="450" y="35" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Friendly Neighbor — Architecture</text>

  <!-- User -->
  <rect x="50" y="80" width="180" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="140" y="108" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">👤 User (Browser)</text>
  <text x="140" y="126" text-anchor="middle" fill="#94a3b8" font-size="10">Voice + Map + Location</text>

  <!-- VAPI -->
  <rect x="320" y="70" width="260" height="80" rx="10" fill="#0d3330" stroke="#37aa9d" stroke-width="2.5"/>
  <text x="450" y="100" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">⭐ VAPI</text>
  <text x="450" y="120" text-anchor="middle" fill="#7dd8d3" font-size="10">Voice AI + GPT-4o tool-calling</text>
  <text x="450" y="136" text-anchor="middle" fill="#7dd8d3" font-size="10">+ outbound phone calls</text>

  <!-- Next.js -->
  <rect x="320" y="230" width="260" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="450" y="258" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">⚙️ Next.js Server</text>
  <text x="450" y="278" text-anchor="middle" fill="#94a3b8" font-size="10">API routes, SSE, orchestration</text>

  <!-- APIFY -->
  <rect x="50" y="230" width="220" height="70" rx="10" fill="#3d1a00" stroke="#f86606" stroke-width="2.5"/>
  <text x="160" y="258" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">⭐ APIFY</text>
  <text x="160" y="278" text-anchor="middle" fill="#fdba8c" font-size="10">Google Places search near user</text>

  <!-- BOX -->
  <rect x="630" y="230" width="220" height="70" rx="10" fill="#001a3d" stroke="#0061d5" stroke-width="2.5"/>
  <text x="740" y="258" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">⭐ BOX</text>
  <text x="740" y="278" text-anchor="middle" fill="#6eaaff" font-size="10">Store PDFs + webhooks → VAPI calls</text>

  <!-- Neighbor -->
  <rect x="660" y="70" width="200" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="760" y="98" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">📞 Neighbor</text>
  <text x="760" y="116" text-anchor="middle" fill="#94a3b8" font-size="10">Receives VAPI outbound call</text>

  <!-- Arrows -->
  <!-- User → Vapi -->
  <line x1="230" y1="100" x2="315" y2="100" stroke="#37aa9d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="292" y="92" text-anchor="middle" fill="#7dd8d3" font-size="9">voice</text>

  <!-- Vapi → Next.js -->
  <line x1="450" y1="152" x2="450" y2="225" stroke="#37aa9d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="475" y="190" text-anchor="start" fill="#7dd8d3" font-size="9">tool calls</text>

  <!-- Next.js → Apify -->
  <line x1="320" y1="260" x2="275" y2="260" stroke="#f86606" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="297" y="252" text-anchor="middle" fill="#fdba8c" font-size="9">search</text>

  <!-- Apify → Next.js -->
  <line x1="275" y1="278" x2="320" y2="278" stroke="#f86606" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="297" y="293" text-anchor="middle" fill="#fdba8c" font-size="9">places</text>

  <!-- Next.js → Box -->
  <line x1="580" y1="260" x2="625" y2="260" stroke="#0061d5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="602" y="252" text-anchor="middle" fill="#6eaaff" font-size="9">upload</text>

  <!-- Box → Next.js (webhook) -->
  <line x1="630" y1="280" x2="585" y2="280" stroke="#0061d5" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="607" y="293" text-anchor="middle" fill="#6eaaff" font-size="9">webhook</text>

  <!-- Next.js → Vapi (outbound call) -->
  <!-- Exit Next.js right edge, arc through clear space to VAPI right edge -->
  <path d="M 580 245 Q 620 190 580 155" fill="none" stroke="#37aa9d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="630" y="200" text-anchor="start" fill="#7dd8d3" font-size="9">outbound call</text>

  <!-- Vapi → Neighbor -->
  <!-- VAPI right edge → Neighbor left edge (both at top) -->
  <line x1="580" y1="100" x2="655" y2="100" stroke="#37aa9d" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="617" y="92" text-anchor="middle" fill="#7dd8d3" font-size="9">phone call</text>

  <!-- Next.js → User (SSE) -->
  <!-- Routes: Next.js left edge → straight left, then up to User right edge -->
  <path d="M 320 260 Q 240 260 230 140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="248" y="210" text-anchor="end" fill="#94a3b8" font-size="9">SSE (map)</text>
</svg>
